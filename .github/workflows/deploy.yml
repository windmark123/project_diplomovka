name: Nasadenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Kontrola typov
        run: npm run typecheck

      - name: Testy
        run: npm test

      # Zostava používa relatívne cesty, takže funguje v koreni domény
      # aj v podadresári projektovej stránky bez ďalšieho nastavovania.
      - name: Zostavenie
        run: npm run build

      - name: Zostavenie jednosúborovej prílohy
        run: npm run build:single

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
